services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pcbaudit
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: pcb_defect_auditor
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # This tells your FastAPI app to talk to the local Docker 'db' container 
      # instead of your remote Neon database.
      - DATABASE_URL=postgresql://pcbaudit:localdevpassword@db:5432/pcb_defect_auditor
    depends_on:
      - db